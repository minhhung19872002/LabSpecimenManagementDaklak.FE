name: Deploy Frontend to Azure AKS

on:
  push:
    branches:
      - main  # Auto-deploy main branch to production
  workflow_dispatch:  # Allow manual trigger

env:
  ACR_NAME: acrlabspecimenprod
  IMAGE_NAME: lab-specimen-frontend
  RESOURCE_GROUP: rg-lab-specimen-prod
  AKS_CLUSTER_NAME: aks-lab-specimen-prod
  NAMESPACE: lab-specimen
  DEPLOYMENT_NAME: lab-specimen-frontend

jobs:
  build:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Login Server
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "ACR Login Server: $ACR_LOGIN_SERVER"

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          # Get commit SHA for tagging
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # Full image names
          IMAGE_TAG_LATEST="${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest"
          IMAGE_TAG_SHA="${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:$SHORT_SHA"

          echo "Building Docker image..."
          docker build \
            --build-arg VITE_API_BASE_URL=https://starlab.bluestar.com.vn \
            --build-arg VITE_APP_NAME="Lab Specimen Management System" \
            --build-arg VITE_NODE_ENV=production \
            -t $IMAGE_TAG_LATEST -t $IMAGE_TAG_SHA .

          echo "Pushing image with 'latest' tag..."
          docker push $IMAGE_TAG_LATEST

          echo "Pushing image with commit SHA tag..."
          docker push $IMAGE_TAG_SHA

          echo "✅ Successfully pushed:"
          echo "  - $IMAGE_TAG_LATEST"
          echo "  - $IMAGE_TAG_SHA"

      - name: Verify Image in ACR
        run: |
          echo "Verifying images in ACR..."
          az acr repository show --name ${{ env.ACR_NAME }} --repository ${{ env.IMAGE_NAME }}

          echo ""
          echo "Recent tags:"
          az acr repository show-tags --name ${{ env.ACR_NAME }} --repository ${{ env.IMAGE_NAME }} --orderby time_desc --top 5 -o table

      - name: Logout from Azure
        if: always()
        run: |
          az logout
          docker logout ${{ steps.acr.outputs.login_server }}

  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Trigger Deployment Rollout
        run: |
          echo "Triggering deployment rollout (fast mode - no waiting)..."
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

          echo "✅ Deployment triggered successfully!"
          echo "Kubernetes will handle the rollout in the background."
          echo ""
          echo "Check status with:"
          echo "  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}"

      - name: Logout from Azure
        if: always()
        run: |
          az logout
